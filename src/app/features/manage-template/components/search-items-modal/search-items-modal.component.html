<ion-modal #modal trigger="open-modal" [initialBreakpoint]="0.5" [breakpoints]="[0, 0.5, 0.75, 1]">
  <ng-template>
    <ion-content class="ion-padding">
      <ion-searchbar
        placeholder="Buscar objetos..."
        (click)="modal.setCurrentBreakpoint(0.75)"
        [formControl]="searchControl"
      ></ion-searchbar>

      <div class="items-container">
        @for (item of allItems; track item.id) {
          <app-item-card
            [item]="item"
            class="selectable-item"
            (handleClick)="onItemClick($event)"
            [class.selected]="selectedItems.has(item.id)"
          />
        }

        @if (allItems.length === 0 && searchControl.value) {
          <app-search-empty-state target="objetos" />
        }
      </div>
      <ion-infinite-scroll (ionInfinite)="onIonInfinite($event)">
        <ion-infinite-scroll-content></ion-infinite-scroll-content>
      </ion-infinite-scroll>
    </ion-content>
  </ng-template>
</ion-modal>
