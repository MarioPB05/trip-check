<ion-modal
  #modal
  trigger="open-modal"
  [initialBreakpoint]="0.25"
  [breakpoints]="[0, 0.25, 0.5, 0.75]"
>
  <ng-template>
    <ion-content class="ion-padding">
      <ion-searchbar
        placeholder="Buscar objetos..."
        (click)="modal.setCurrentBreakpoint(0.75)"
      ></ion-searchbar>
    </ion-content>
  </ng-template>
</ion-modal>
