<div class="future-trip-card">
  <div class="trip-info">
    <h4 class="title">{{ trip.name }}</h4>
    <p class="details">{{ trip.destination }} - {{ duration }}</p>
  </div>

  <app-trip-button
    type="secondary"
    class="plan-trip-button"
    btnClass="flex center small gap-2"
    (handleClick)="onPlanTripClick()"
  >
    Planear <lucide-icon [img]="Briefcase" [size]="20" />
  </app-trip-button>
</div>
