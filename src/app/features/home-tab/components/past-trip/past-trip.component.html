<div class="past-trip-card">
  <div class="trip-info">
    <h4 class="title">{{ trip.name }}</h4>
    <p class="details">{{ trip.destination }} - {{ duration }}</p>
  </div>

  <app-trip-button
    type="secondary"
    class="view-details-button"
    btnClass="center small"
    (handleClick)="onViewDetailsClick()"
  >
    Ver detalles <lucide-icon [img]="ChevronRight" style="height: 24px" />
  </app-trip-button>
</div>
