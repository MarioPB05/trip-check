<div class="item-card-editable" (click)="cardClicked.emit()">
  <div class="item-info">
    <img [ngSrc]="item.emojiUrl" class="item-icon" width="64" height="64" alt="" priority />
    <p>{{ item.name }}</p>
  </div>

  <div class="item-counter">
    @if (helpText) {
      {{ helpText }}
    }

    <app-quantity-counter
      [quantity]="quantity"
      (click)="$event.stopPropagation()"
      (quantityChange)="quantityChange.emit($event)"
    />
  </div>
</div>
